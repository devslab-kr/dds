name: Release restricted packages

on:
  push:
    tags:
      - "dds-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@devslab-kr"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
      - run: pnpm run verify:canary:dependencies
      - run: pnpm run verify:canary:test
      - run: pnpm run verify:canary:build
      - run: pnpm run verify:canary:preview
      - run: pnpm run verify:foundation
      - run: pnpm run verify:release
      - run: pnpm run verify:solid:test
      - run: pnpm run verify:solid:a11y
      - run: pnpm run verify:solid:release
      - run: pnpm run verify:site-kit:ui
      - run: pnpm run verify:site-kit:browser
      - run: pnpm run verify:site-kit:release
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          packages=(dds-tokens dds-css dds-icons dds-solid site-kit)
          for package in "${packages[@]}"; do
            visibility="$(gh api "orgs/devslab-kr/packages/npm/${package}" --jq '.visibility')"
            if [[ "${visibility}" != "internal" ]]; then
              echo "::warning title=Package visibility::@devslab-kr/${package} is ${visibility}; change it to Internal in package settings."
              echo "- [ ] Set \`@devslab-kr/${package}\` visibility to **Internal**: https://github.com/orgs/devslab-kr/packages/npm/${package}/settings" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
