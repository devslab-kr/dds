# Release — versioning and publishing to public npm through the standard
# Changesets flow, the same shape linq-kit uses.
#
# Two modes, chosen automatically by changesets/action@v1 on every push to
# main:
#
#   1. Unconsumed changeset files exist in `.changeset/*.md` → the action
#      opens (or refreshes) a "chore: release dds" PR that bumps the fixed
#      group's versions and deletes the consumed changesets. Merging that PR
#      is the release decision.
#
#   2. No unconsumed changesets (the release PR was just merged, or a
#      version was bumped by hand) → the action runs `pnpm release`, which
#      runs `changeset publish` for the public npm packages. New versions
#      are published, and a git tag per package is pushed. Versions
#      already on npm are skipped, so re-runs are safe.
#
# The publish only happens after the full verification gate below — the
# same gates CI runs — so a red main never reaches npm.
#
# Publishing uses npm trusted publishing only: `id-token: write` lets npm
# exchange this job's OIDC token for a short-lived publish credential, per
# package, against the Trusted Publisher each package declares on npmjs.com
# (`devslab-kr/dds`, `release.yml`, no environment). Provenance is attached
# the same way. There is deliberately no npm token here. Until 0.35.1 the job
# also passed `NPM_TOKEN`, and npm quietly fell back to it for the six
# packages that had no Trusted Publisher yet — they shipped under a personal
# account and nothing failed. Without a token, a package whose Trusted
# Publisher is missing or wrong fails the publish instead.
#
# setup-node gets no `registry-url` for the same reason: that option writes an
# `.npmrc` whose auth line reads `${NODE_AUTH_TOKEN}`, which every step then
# warned about. npm's default registry is already registry.npmjs.org, and each
# package's `publishConfig.registry` names it as well.
#
# Before 2026-09-03 this workflow ran only on a hand-pushed `dds-v*` tag;
# two release commits (0.4.0, 0.4.1) sat on main for days without a tag and
# npm stayed at 0.3.0. The tag is no longer the trigger.

name: Release public packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
      - run: pnpm run verify:canary:dependencies
      - run: pnpm run verify:canary:test
      - run: pnpm run verify:canary:build
      - run: pnpm run verify:canary:preview
      - run: pnpm run verify:foundation
      - run: pnpm run verify:release
      # Package test scripts already include their axe suites.
      - run: pnpm run verify:solid:test
      - run: pnpm run verify:solid:release
      - run: pnpm run verify:table:test
      - run: pnpm run verify:table:release
      - run: pnpm run verify:vue:test
      - run: pnpm run verify:vue:release
      - run: pnpm run verify:svelte:test
      - run: pnpm run verify:svelte:release
      - run: pnpm run verify:foundation:layouts
      - run: pnpm run verify:table-vue:test
      - run: pnpm run verify:table-vue:release
      - run: pnpm run verify:vue:browser
      - run: pnpm run verify:react:test
      - run: pnpm run verify:react:browser
      - run: pnpm run verify:react:release
      - run: pnpm run verify:auth:test
      - run: pnpm run verify:auth:browser
      - run: pnpm run verify:auth:release
      - run: pnpm run verify:table-react:test
      - run: pnpm run verify:table-react:browser
      - run: pnpm run verify:table-react:release
      - run: pnpm run verify:site-kit:ui
      - run: pnpm run verify:site-kit:browser
      - run: pnpm run verify:site-kit:release
      - run: pnpm run verify:components
      - name: Create the release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          # `changeset version` rewrites the fixed group's internal
          # `workspace:x.y.z` specifiers but never touches pnpm-lock.yaml, so
          # the version PR it opens fails `pnpm install --frozen-lockfile`
          # the moment it lands on main. Refresh the lockfile in the same
          # commit — lockfile only, node_modules untouched.
          # One token after the command, nothing more: changesets/action splits
          # this string on spaces and hands the rest to the script as arguments
          # — `changeset version "&&" "pnpm" "install" "--lockfile-only"` is what
          # the previous form actually ran, and changesets refuses extra
          # arguments. The lockfile refresh lives inside the npm script.
          version: pnpm version-packages
          commit: "chore: release dds"
          title: "chore: release dds"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Summarise what was published
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          {
            echo "### Published to npm"
            echo ""
            echo "$PUBLISHED" | jq -r '.[] | "- `\(.name)@\(.version)`"'
          } >> "$GITHUB_STEP_SUMMARY"
