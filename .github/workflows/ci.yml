name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm run verify:source:stage1-2
      - run: pnpm run verify:source:stage3-4

  verify:
    needs: source-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify:canary:dependencies
      - run: pnpm run verify:canary:test
      - run: pnpm run verify:canary:build
      - run: pnpm run verify:canary:preview
      - run: pnpm run verify:foundation
      - run: pnpm run verify:release
      - run: pnpm run verify:solid:test
      - run: pnpm run verify:solid:a11y
      - run: pnpm run verify:solid:release
      - run: pnpm run verify:site-kit:i18n
      - run: pnpm run verify:site-kit:ui
      - run: pnpm run verify:site-kit:seo
      - run: pnpm run verify:site-kit:browser
      - run: pnpm run verify:site-kit:release
      # build all packages, then validate token JSON + docs/preview sync
      - run: pnpm run verify
      # stories must keep building against the current CSS/tokens
      - run: pnpm exec storybook build
