name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded pull request runs; main verification runs finish normally.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm run verify:source:stage1-2
      - run: pnpm run verify:source:stage3-4

  verify:
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify:canary:dependencies
      - run: pnpm run verify:canary:test
      - run: pnpm run verify:canary:build
      - run: pnpm run verify:canary:preview
      # Includes the Storybook build and browser foundation checks.
      - run: pnpm run verify:foundation
      - run: pnpm run verify:release
      # Package test scripts include their axe suites; avoid running them twice.
      - run: pnpm run verify:solid:test
      - run: pnpm run verify:solid:release
      - run: pnpm run verify:table:test
      - run: pnpm run verify:table:release
      - run: pnpm run verify:vue:test
      - run: pnpm run verify:vue:release
      - run: pnpm run verify:react:test
      - run: pnpm run verify:react:browser
      - run: pnpm run verify:react:release
      - run: pnpm run verify:table-react:test
      - run: pnpm run verify:table-react:browser
      - run: pnpm run verify:table-react:release
      # i18n and SEO share these same core/publisher suites.
      - run: pnpm run verify:site-kit:i18n
      - run: pnpm run verify:site-kit:ui
      - run: pnpm run verify:site-kit:browser
      - run: pnpm run verify:site-kit:release
      # build all packages, then validate token JSON + docs/preview sync
      - run: pnpm run verify
      - run: pnpm run verify:components
